<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Anime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⭐ Bienvenido <span id="userName"></span></h1>
    <button id="settingsBtn" class="btn-settings">⚙️</button>
  </header>

  <main>
    <section id="search">
      <input type="text" id="animeSearch" placeholder="Buscar anime...">
      <button id="searchBtn">Buscar</button>
    </section>

    <section id="results"></section>

    <section id="recommendations" class="hidden">
      <h2>Recomendaciones</h2>
      <ul id="recList"></ul>
    </section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h3>Ajustes</h3>
      <button id="btnViewRecs">Ver Recomendaciones</button>
      <button id="btnLogout">Cerrar Sesión</button>
      <button id="btnCloseModal">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
